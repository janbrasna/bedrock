name: Build and push a Docker image

on:
  push:
    branches:
      - main
      - stage
      - test-cd
    tags:
      - '*'

jobs:
  build_and_publish_public_images:
    name: Builder
    runs-on: ubuntu-latest

    steps:
      - name: Free space empty
        run: |
          echo "Free space:"
          df -h

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: "cache-from: type=gha cache-to: type=gha,mode=max"

      - uses: actions/checkout@v5
        with:
            fetch-depth: 10 # get enough so we have a Git history, but not everything
            fetch-tags: true
            ref: ${{ env.REF_ID }}

      - name: Free space before buildx
        run: |
          echo "Free space:"
          df -h

      - name: Build and push public images
        run: |
            ./bin/build-release-image.sh
        timeout-minutes: 90
        env:
            GIT_COMMIT: ${{ github.sha }}
